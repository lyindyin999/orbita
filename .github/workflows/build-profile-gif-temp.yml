name: Build seamless profile GIF temp

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-profile-gif-temp.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download source GIF
        run: |
          curl -L --fail --retry 3             "https://media.giphy.com/media/xUPGcvCuJDFgKcNkbe/giphy.gif"             -o /tmp/source.gif

      - name: Remove pause and force infinite loop
        run: |
          mkdir -p assets/profile
          python - <<'PY'
          from PIL import Image, ImageChops
          from statistics import median
          from pathlib import Path

          src = Image.open("/tmp/source.gif")
          frames = []
          durations = []

          for i in range(src.n_frames):
              src.seek(i)
              frames.append(src.convert("RGBA").copy())
              durations.append(int(src.info.get("duration", 40) or 40))

          positive = [d for d in durations if d > 0]
          base = int(median(positive)) if positive else 40

          # Source has a 2000ms hold. Normalize the animation to its native
          # 100ms rhythm so the loop restarts immediately.
          durations = [base for _ in durations]

          while len(frames) > 2:
              a = frames[-1].convert("RGB")
              b = frames[-2].convert("RGB")
              if ImageChops.difference(a, b).getbbox() is None:
                  frames.pop()
                  durations.pop()
              else:
                  break

          out = Path("assets/profile/redbull_loop_nopause.gif")
          frames[0].save(
              out,
              save_all=True,
              append_images=frames[1:],
              duration=durations,
              loop=0,
              disposal=2,
              optimize=True,
          )

          print("frames:", len(frames))
          print("duration per frame:", base, "ms")
          print("loop: infinite")
          PY

      - name: Commit seamless GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/redbull_loop_nopause.gif
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "asset: add seamless profile GIF"
            git push
          fi
